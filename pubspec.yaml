name: better_player_plus
version: 1.1.5
homepage: https://github.com/SunnatilloShavkatov/betterplayer.git
documentation: https://github.com/SunnatilloShavkatov/betterplayer.git
description: "Advanced video player based on video_player and Chewie. It's solves many typical use cases and it's easy to run."

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  # Keep ranges compatible with FlutterNettv lockfile (wakelock_plus 1.2.x / package_info_plus 8.x).
  collection: ^1.18.0
  wakelock_plus: ^1.2.5
  path_provider: ^2.1.3
  visibility_detector: ^0.4.0+2
  flutter_widget_from_html_core: ^0.15.1
  xml: ^6.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  analysis_lints: ^1.0.5

flutter:
  plugin:
    platforms:
      android:
        package: uz.shs.better_player_plus
        pluginClass: BetterPlayerPlugin
      ios:
        pluginClass: BetterPlayerPlugin